server {
    listen 80;
    listen [::]:80;
    server_name eh-api.robbiemed.org;

    location / {
        proxy_pass http://127.0.0.1:8104;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 180s;
    }
}
# TLS: sudo certbot --nginx -d eh-api.robbiemed.org
# (after the DNS A record eh-api.robbiemed.org -> 157.180.87.209 exists, grey cloud)
