<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#7c3aed">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>eh.</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- LOGIN -->
  <section id="screen-login" class="screen">
    <div class="hero">
      <div class="logo">eh<span>.</span></div>
      <p class="tagline">your e-value feedback, vibed.</p>
    </div>
    <form id="login-form" class="card login">
      <label>e-value username <input id="l-user" type="text" autocomplete="username" autocapitalize="off" required></label>
      <label>password <input id="l-pass" type="password" autocomplete="current-password" required></label>
      <button id="l-go" class="btn primary big" type="submit">Let's go</button>
      <p id="l-status" class="muted center"></p>
      <p class="fine">Your login stays on this device and is only sent to the eh. proxy to sign in to e-value.</p>
    </form>
  </section>

  <!-- APP: three panes under one header, bottom tabs -->
  <section id="screen-inbox" class="screen">
    <header class="top">
      <div class="logo sm">eh<span>.</span></div>
      <div class="top-actions">
        <button id="fun-btn" class="icon-btn fun" type="button" aria-label="Emoji explosions" aria-pressed="false">💥</button>
        <button id="music-btn" class="icon-btn fun" type="button" aria-label="Music" aria-pressed="false">🎵</button>
        <button id="refresh" class="icon-btn" type="button" aria-label="Refresh">↻</button>
        <button id="open-settings" class="icon-btn" type="button" aria-label="Settings">⚙︎</button>
      </div>
    </header>
    <div id="pane-todo" class="pane">
      <h1 id="headline" class="headline">Loading…</h1>
      <p id="subline" class="muted"></p>
      <div id="list" class="list"></div>
    </div>
    <div id="pane-done" class="pane"></div>
    <div id="pane-about" class="pane"></div>
  </section>

  <nav id="tabs" class="tabs hidden" aria-label="Sections">
    <button type="button" data-tab="todo"><span class="t-ico">✍️</span><span>To do</span><b id="todo-badge" class="badge hidden"></b></button>
    <button type="button" data-tab="done"><span class="t-ico">✅</span><span>Done</span></button>
    <button type="button" data-tab="about"><span class="t-ico">🪞</span><span>About me</span><b id="about-badge" class="badge hidden"></b></button>
  </nav>

  <!-- READ-ONLY VIEWER (completed evals) -->
  <div id="viewer" class="sheet-wrap hidden" aria-modal="true" role="dialog">
    <div class="sheet">
      <div class="sheet-head">
        <button id="viewer-close" class="icon-btn" type="button" aria-label="Close">✕</button>
        <div class="sheet-title">
          <div id="v-kind" class="chip"></div>
          <h2 id="v-title"></h2>
          <p id="v-meta" class="muted"></p>
        </div>
        <span class="icon-btn ghost-slot" aria-hidden="true"></span>
      </div>
      <div id="v-body" class="s-body"></div>
    </div>
  </div>

  <!-- REVIEW SHEET -->
  <div id="sheet" class="sheet-wrap hidden" aria-modal="true" role="dialog">
    <div class="sheet">
      <div class="sheet-head">
        <button id="sheet-close" class="icon-btn" type="button" aria-label="Close">✕</button>
        <div class="sheet-title">
          <div id="s-kind" class="chip"></div>
          <h2 id="s-subject"></h2>
          <p id="s-meta" class="muted"></p>
        </div>
        <button id="reroll" class="icon-btn" type="button" aria-label="Rewrite everything">🎲</button>
      </div>
      <div id="s-vibes" class="vibes compact"></div>
      <div id="s-body" class="s-body"></div>
      <div class="sheet-foot">
        <p id="s-status" class="muted center"></p>
        <div class="foot-row">
          <button id="save-draft" class="btn ghost" type="button">Save draft</button>
          <button id="submit" class="btn primary" type="button">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <!-- SETTINGS -->
  <div id="settings" class="sheet-wrap hidden" role="dialog" aria-modal="true">
    <div class="sheet small">
      <div class="sheet-head">
        <h2>Settings</h2>
        <button id="settings-close" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>
      <div class="s-body">
        <label>Proxy URL <input id="set-proxy" type="url"></label>
        <div class="fun-set">
          <h3>Fun</h3>
          <label class="switch"><input id="fun-bursts" type="checkbox"> 💥 Emoji explosions on every tap</label>
          <label class="switch"><input id="fun-music" type="checkbox"> 🎵 Procedural music</label>
          <div id="fun-mood" class="chips"></div>
          <p id="fun-auto" class="fine left"></p>
        </div>
        <button id="forget-answers" class="btn ghost" type="button">Forget remembered answers</button>
        <button id="logout" class="btn ghost danger" type="button">Log out</button>
        <p class="fine">Remembered answers: the non-rating questions (like "% of time on rotation") reuse what you picked last time.</p>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="app.js"></script>
</body>
</html>
